# ══════════════════════════════════════════════════════════════
# PetOS — Perfil de produção (container Docker)
# Caminho: src/main/resources/application-prod.properties
#
# IMPORTANTE: Em produção o H2 roda em modo ARQUIVO (não memória)
# O arquivo petosdb.mv.db fica em /app/data — montado como volume
# nomeado no Docker Compose, garantindo persistência dos dados.
# ══════════════════════════════════════════════════════════════

# ── H2 — modo arquivo (persistência via volume Docker) ────────
spring.datasource.url=jdbc:h2:file:/app/data/petosdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── H2 Console (acesso externo habilitado) ────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ── Servidor ──────────────────────────────────────────────────
server.port=8080

# ── Actuator ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logs ──────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.br.com.petos=INFO
